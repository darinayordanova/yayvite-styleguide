name: docs-drift

# Runs on every pull request and checks the whole of src/, not just the
# components the PR changed.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: darinayordanova/story-sync@main
        with:
          path: src
          # Fail on drift anywhere, including components the PR didn't touch.
          fail-on: any
