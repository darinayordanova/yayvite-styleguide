name: docs-drift
  on:
    pull_request:
      paths:
        - "src/**"
        - ".storybook/**"

  permissions:
    contents: read
    pull-requests: write

  jobs:
    docs-drift:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
        - run: npm ci   # yarn? use: yarn install --frozen-lockfile · pnpm? use pnpm/action-setup + pnpm install
        - uses: darinayordanova/story-sync@main
          with:
            path: src/components